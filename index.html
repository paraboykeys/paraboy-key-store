
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PARABOY Key Store</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10121b;
      color: white;
      text-align: center;
    }
    header {
      padding: 24px 12px;
      background: #191d2c;
    }
    h1 { color: #8b9cff; }
    main { padding: 28px 16px; }
    .card {
      max-width: 420px;
      margin: 20px auto;
      padding: 24px;
      background: #202538;
      border-radius: 16px;
    }
    button {
      padding: 12px 20px;
      border: 0;
      border-radius: 8px;
      background: #7788ff;
      color: #10121b;
      font-weight: bold;
    }
    footer { padding: 20px; color: #bbb; }
  </style>
</head>
<body>
  <header>
    <h1>PARABOY KEY STORE</h1>
    <p>Your game key store</p>
  </header>
  <main>
    <div class="card">
      <h2>Welcome, Gamer!</h2>
      <p>Our game catalogue is coming soon.</p>
      <p>Contact the store for availability.</p>
      <button onclick="alert('Game catalogue coming soon!')">
        Explore Store
      </button>
    </div>
  </main>
  <footer>© PARABOY Key Store</footer>
</body>
</html>
